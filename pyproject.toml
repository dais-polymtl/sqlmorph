[project]
name = "sqlmorph"
version = "0.1.0"
description = "SQLMorph: Query Mutation and Fine-Grained Metrics for Text-to-SQL Evaluation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.2.1",
    "func-timeout>=4.3.5",
    "google-cloud-aiplatform>=1.120.0",
    "google-generativeai>=0.8.5",
    "jinja2>=3.1.5",
    "loguru>=0.7.3",
    "matplotlib>=3.10.0",
    "matplotlib-venn>=1.1.2",
    "networkx>=3.4.2",
    "notebook>=7.4.3",
    "ollama>=0.4.7",
    "openai>=1.60.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "portkey-ai>=1.12.0",
    "pyodbc>=5.2.0",
    "python-dotenv>=1.0.1",
    "scipy>=1.15.1",
    "seaborn>=0.13.2",
    "sqlglot>=26.2.1",
    "sqlparse>=0.5.3",
    "tiktoken>=0.9.0",
    "together>=1.5.26",
    "torch>=2.6.0",
    "torchaudio>=2.6.0",
    "torchvision>=0.21.0",
    "transformers>=4.51.0",
]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "pre-commit>=4.1.0",
    "ruff>=0.11.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "README.md",
    "LICENSE",
]
